http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=10g inactive=60m use_temp_path=off;

    client_max_body_size 15M;
    
    upstream core_service {
        server core_service:8080;
    }

    upstream football_service {
        server football_service:8081;
    }

    server {
        listen 80;

        # Serviço principal
        location / {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
                add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Cookie' always;
                add_header Access-Control-Max-Age 3600 always;
                add_header Access-Control-Allow-Credentials true always;
                return 204;
            }

            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Cookie' always;
            add_header Access-Control-Max-Age 3600 always;
            add_header Access-Control-Allow-Credentials true always;

            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass http://core_service;
        }

        # Serviço de futebol
        location ~ ^/(matches|teams|news) {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Content-Type' always;
                add_header Access-Control-Max-Age 3600 always;
                add_header Access-Control-Allow-Credentials false always;
                return 204;
            }

            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Content-Type' always;
            add_header Access-Control-Max-Age 3600 always;
            add_header Access-Control-Allow-Credentials false always;

            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass http://football_service;
        }
    }
}

events {
    worker_connections 1024;
}
