http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=10g inactive=60m use_temp_path=off;

    client_max_body_size 15M;
    
    upstream core_service {
        server f_core_service:8080;
    }

    upstream football_service {
        server f_football_service:8081;
    }

    server {
        listen 80;
        server_name api.futeboxd.com;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name api.futeboxd.com;

        ssl_certificate /etc/letsencrypt/live/api.futeboxd.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.futeboxd.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/api.futeboxd.com/chain.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers off;

        error_page 404 = @json_404;
        error_page 502 = @json_502;

        location @json_502 {
            default_type application/json; charset=utf-8;
            return 502 '{"message": "Serviço indisponível no momento, tente novamente mais tarde", "code": null}';
        }

        location @json_404 {
            default_type application/json; charset=utf-8;
            return 404 '{"message": "Página não encontrada", "code": null}';
        }

        # Serviço principal
        location ~ ^/(?:comments|popular|profiles|reviews|sessions|uploads|users)(/|$) {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
                add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Cookie' always;
                add_header Access-Control-Max-Age 3600 always;
                add_header Access-Control-Allow-Credentials true always;
                return 204;
            }

            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Cookie' always;
            add_header Access-Control-Max-Age 3600 always;
            add_header Access-Control-Allow-Credentials true always;

            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass http://core_service;
        }

        # Serviço de futebol
        location ~ ^/(?:matches|teams|news)(/|$) {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Content-Type' always;
                add_header Access-Control-Max-Age 3600 always;
                add_header Access-Control-Allow-Credentials false always;
                return 204;
            }

            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Content-Type' always;
            add_header Access-Control-Max-Age 3600 always;
            add_header Access-Control-Allow-Credentials false always;

            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass http://football_service;
        }
    }
}

events {
    worker_connections 1024;
}
