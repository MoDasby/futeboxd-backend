services:
  core-db:
    container_name: "core-db"
    image: postgres:latest
    env_file: ./services/core/.env
    volumes:
      - ./infra/core/migrations:/docker-entrypoint-initdb.d
      - postgres_core_data:/var/lib/postgresql/data
    networks:
      - futeboxd
    deploy:
      resources:
        limits:
          memory: 1.5g
          cpus: "0.5"  # Limita a 50% de um núcleo
        reservations:
          memory: 1g
          
  core:
    container_name: core-service
    env_file: ./services/core/.env
    build: 
      context: .
      dockerfile: ./services/core/dockerfile
    depends_on:
      - core-db
    networks:
      - futeboxd
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"  # Limita a 100% de um núcleo
        reservations:
          memory: 1g

  football-db:
    container_name: "football-db"
    image: postgres:latest
    env_file: ./services/football/.env
    volumes:
      - ./infra/football/migrations:/docker-entrypoint-initdb.d
      - postgres_football_data:/var/lib/postgresql/data
    networks:
      - futeboxd
    deploy:
      resources:
        limits:
          memory: 1.5g
          cpus: "0.5"  # Limita a 50% de um núcleo
        reservations:
          memory: 1g

  football:
    container_name: football-service
    env_file: ./services/football/.env
    build: 
      context: .
      dockerfile: ./services/football/dockerfile
    depends_on:
      - football-db
    networks:
      - futeboxd
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"  # Limita a 100% de um núcleo
        reservations:
          memory: 1g

  nginx:
    container_name: nginx
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf  # Mapeia o arquivo de configuração do Nginx
    ports:
      - "80:80"  # Expõe a porta 80
    networks:
      - futeboxd
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.2"  # Limita a 20% de um núcleo
        reservations:
          memory: 256m

networks:
  futeboxd:
    driver: bridge

volumes:
  postgres_core_data:
  postgres_football_data:
